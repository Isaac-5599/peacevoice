<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — PeaceVoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div style="max-width:1280px;margin:0 auto;padding:2rem 1.5rem">
    <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap;gap:1rem">
      <h1 style="font-size:1.75rem;font-weight:700">Events</h1>
      <div class="flex items-center gap-2">
        <select class="form-input" id="filter-type" style="width:auto" onchange="loadEvents()">
          <option value="">All Types</option>
          <option value="rally">Rally</option>
          <option value="town_hall">Town Hall</option>
          <option value="workshop">Workshop</option>
          <option value="webinar">Webinar</option>
          <option value="other">Other</option>
        </select>
        <select class="form-input" id="filter-status" style="width:auto" onchange="loadEvents()">
          <option value="">All</option>
          <option value="upcoming">Upcoming</option>
          <option value="completed">Past</option>
        </select>
        <button class="btn btn-primary" onclick="showCreateModal()">Create Event</button>
      </div>
    </div>

    <div id="events-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1.5rem"></div>
    <div id="events-empty" class="text-muted" style="text-align:center;padding:3rem;display:none">No events found.</div>
  </div>

  <!-- Create Event Modal -->
  <div id="create-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal">
      <h2>Create a New Event</h2>
      <form id="event-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-input" id="evt-title" required>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select class="form-input" id="evt-type">
            <option value="rally">Rally</option>
            <option value="town_hall">Town Hall</option>
            <option value="workshop">Workshop</option>
            <option value="webinar">Webinar</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date & Time</label>
          <input type="datetime-local" class="form-input" id="evt-date" required>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" class="form-input" id="evt-location" placeholder="Address or venue name">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:0.5rem">
          <input type="checkbox" id="evt-virtual" style="width:16px;height:16px">
          <label for="evt-virtual" style="margin:0">This is a virtual event</label>
        </div>
        <div class="form-group">
          <label>Virtual Link (if applicable)</label>
          <input type="url" class="form-input" id="evt-link" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea class="form-input" id="evt-description" required rows="4" placeholder="Describe the event, its purpose, and what attendees can expect..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('create-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Event</button>
        </div>
      </form>
    </div>
  </div>

  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script>
    const typeLabels = { rally: 'Rally', town_hall: 'Town Hall', workshop: 'Workshop', webinar: 'Webinar', other: 'Event' };
    const typeColors = { rally: '#EF4444', town_hall: '#3B82F6', workshop: '#8B5CF6', webinar: '#059669', other: '#6B7280' };

    async function loadEvents() {
      const type = document.getElementById('filter-type').value;
      const status = document.getElementById('filter-status').value;
      let url = '/events?';
      if (type) url += `type=${type}&`;
      if (status) url += `status=${status}`;

      const data = await api.get(url);
      const container = document.getElementById('events-list');
      const empty = document.getElementById('events-empty');

      if (data.events.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      container.innerHTML = data.events.map(e => {
        const d = new Date(e.event_date);
        const month = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
        const day = d.getDate();
        const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return `
          <a href="/pages/event-detail.html?id=${e.id}" style="text-decoration:none">
            <div class="card" style="cursor:pointer">
              <div class="flex gap-4">
                <div style="text-align:center;min-width:56px;padding-top:0.25rem">
                  <div style="font-size:0.75rem;font-weight:600;color:var(--primary)">${month}</div>
                  <div style="font-size:1.75rem;font-weight:700;line-height:1">${day}</div>
                  <div class="text-xs text-muted" style="margin-top:0.25rem">${time}</div>
                </div>
                <div style="flex:1">
                  <span class="badge" style="background:${typeColors[e.event_type] || '#6B7280'}15;color:${typeColors[e.event_type] || '#6B7280'};margin-bottom:0.375rem">
                    ${typeLabels[e.event_type] || 'Event'}
                  </span>
                  ${e.status === 'completed' ? '<span class="badge badge-danger" style="margin-left:0.25rem">Past</span>' : ''}
                  <h3 style="font-size:1rem;font-weight:600;color:var(--text);margin:0.375rem 0">${esc(e.title)}</h3>
                  <p class="text-sm text-muted">${esc(e.location || 'Virtual Event')}</p>
                  <p class="text-xs text-muted mt-1">${e.rsvp_count} attending &bull; Organized by ${esc(e.display_name)}</p>
                </div>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    function showCreateModal() {
      if (!window._currentUser) {
        showToast('Please log in to create an event', 'error');
        window.location.href = '/pages/login.html';
        return;
      }
      document.getElementById('create-modal').style.display = 'flex';
    }

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const result = await api.post('/events', {
          title: document.getElementById('evt-title').value,
          event_type: document.getElementById('evt-type').value,
          event_date: document.getElementById('evt-date').value,
          location: document.getElementById('evt-location').value,
          is_virtual: document.getElementById('evt-virtual').checked,
          virtual_link: document.getElementById('evt-link').value,
          description: document.getElementById('evt-description').value
        });
        showToast('Event created!');
        document.getElementById('create-modal').style.display = 'none';
        window.location.href = `/pages/event-detail.html?id=${result.event.id}`;
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    initPage().then(loadEvents);
  </script>
</body>
</html>
