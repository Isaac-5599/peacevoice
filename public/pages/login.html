<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — PeaceVoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem">
    <div class="card" style="width:100%;max-width:420px">
      <h2 style="text-align:center;margin-bottom:0.5rem">Welcome Back</h2>
      <p class="text-sm text-muted" style="text-align:center;margin-bottom:1.5rem">Log in to continue making a difference</p>
      <form id="login-form">
        <div class="form-group">
          <label>Username or Email</label>
          <input type="text" class="form-input" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-input" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">Log In</button>
      </form>
      <p class="text-sm text-muted" style="text-align:center;margin-top:1rem">
        Don't have an account? <a href="/pages/register.html" style="color:var(--primary);font-weight:500">Sign up</a>
      </p>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script>
    initPage();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api.post('/auth/login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        });
        showToast('Welcome back!');
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
