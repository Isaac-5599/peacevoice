<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petitions — PeaceVoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div style="max-width:1280px;margin:0 auto;padding:2rem 1.5rem">
    <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap;gap:1rem">
      <h1 style="font-size:1.75rem;font-weight:700">Petitions</h1>
      <div class="flex items-center gap-2">
        <select class="form-input" id="filter-status" style="width:auto" onchange="loadPetitions()">
          <option value="">All Status</option>
          <option value="open">Open</option>
          <option value="closed">Closed</option>
          <option value="delivered">Delivered</option>
        </select>
        <select class="form-input" id="filter-sort" style="width:auto" onchange="loadPetitions()">
          <option value="newest">Newest</option>
          <option value="signatures">Most Signatures</option>
        </select>
        <button class="btn btn-primary" onclick="showCreateModal()">Start a Petition</button>
      </div>
    </div>

    <div id="petitions-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1.5rem"></div>
    <div id="petitions-empty" class="text-muted" style="text-align:center;padding:3rem;display:none">No petitions found.</div>
  </div>

  <!-- Create Petition Modal -->
  <div id="create-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal">
      <h2>Start a New Petition</h2>
      <form id="petition-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-input" id="pet-title" required placeholder="What change do you want to see?">
        </div>
        <div class="form-group">
          <label>Target</label>
          <input type="text" class="form-input" id="pet-target" placeholder="Who should take action? (e.g. City Council, Legislature)">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea class="form-input" id="pet-description" required placeholder="Explain why this change matters and what action you're calling for..." rows="5"></textarea>
        </div>
        <div class="form-group">
          <label>Signature Goal</label>
          <input type="number" class="form-input" id="pet-goal" value="100" min="10">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('create-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-secondary">Create Petition</button>
        </div>
      </form>
    </div>
  </div>

  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script>
    const statusColors = { open: 'badge-secondary', closed: 'badge-danger', delivered: 'badge-accent' };
    const statusLabels = { open: 'Open', closed: 'Closed', delivered: 'Delivered' };

    async function loadPetitions() {
      const status = document.getElementById('filter-status').value;
      const sort = document.getElementById('filter-sort').value;
      let url = '/petitions?';
      if (status) url += `status=${status}&`;
      if (sort) url += `sort=${sort}`;

      const data = await api.get(url);
      const container = document.getElementById('petitions-list');
      const empty = document.getElementById('petitions-empty');

      if (data.petitions.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      container.innerHTML = data.petitions.map(p => {
        const pct = Math.min(100, Math.round((p.signature_count / p.goal_signatures) * 100));
        return `
          <div class="card">
            <div class="flex items-center justify-between mb-2">
              <span class="badge ${statusColors[p.status] || ''}">${statusLabels[p.status] || p.status}</span>
              <span class="text-xs text-muted">${timeAgo(p.created_at)}</span>
            </div>
            <h3 style="font-size:1rem;font-weight:600;margin-bottom:0.375rem">
              <a href="/pages/petition-detail.html?id=${p.id}" style="color:var(--text);text-decoration:none">${esc(p.title)}</a>
            </h3>
            <p class="text-sm text-muted" style="margin-bottom:0.5rem">To: ${esc(p.target_entity || 'Decision Makers')}</p>
            <p class="text-sm" style="margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.description.slice(0, 150))}</p>
            <div class="progress-bar" style="margin-bottom:0.5rem"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="flex justify-between text-sm">
              <span><strong>${p.signature_count}</strong> of ${p.goal_signatures}</span>
              <span class="text-muted">${pct}%</span>
            </div>
            <div class="text-xs text-muted mt-2">Started by ${esc(p.display_name)}</div>
          </div>`;
      }).join('');
    }

    function showCreateModal() {
      if (!window._currentUser) {
        showToast('Please log in to create a petition', 'error');
        window.location.href = '/pages/login.html';
        return;
      }
      document.getElementById('create-modal').style.display = 'flex';
    }

    document.getElementById('petition-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const result = await api.post('/petitions', {
          title: document.getElementById('pet-title').value,
          target_entity: document.getElementById('pet-target').value,
          description: document.getElementById('pet-description').value,
          goal_signatures: parseInt(document.getElementById('pet-goal').value)
        });
        showToast('Petition created!');
        document.getElementById('create-modal').style.display = 'none';
        window.location.href = `/pages/petition-detail.html?id=${result.petition.id}`;
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    initPage().then(loadPetitions);
  </script>
</body>
</html>
