<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — PeaceVoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem">
    <div class="card" style="width:100%;max-width:420px">
      <h2 style="text-align:center;margin-bottom:0.5rem">Join PeaceVoice</h2>
      <p class="text-sm text-muted" style="text-align:center;margin-bottom:1.5rem">Create an account to start making a difference</p>
      <form id="register-form">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" class="form-input" id="displayName" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-input" id="username" required placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-input" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-input" id="password" required placeholder="At least 6 characters" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">Create Account</button>
      </form>
      <p class="text-sm text-muted" style="text-align:center;margin-top:1rem">
        Already have an account? <a href="/pages/login.html" style="color:var(--primary);font-weight:500">Log in</a>
      </p>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script>
    initPage();
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api.post('/auth/register', {
          displayName: document.getElementById('displayName').value,
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        showToast('Account created! Welcome to PeaceVoice.');
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
